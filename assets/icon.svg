<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Includa">
  <title>Includa</title>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="highlight" cx="28%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02151b"/>
      <stop offset="100%" stop-color="#08131d"/>
    </linearGradient>
  </defs>

  <!-- Rounded background — iOS-style 22% corner radius -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg-grad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#highlight)"/>

  <!-- Universal accessibility figure: head, arms outstretched, body, legs in a V.
       Public-domain symbol convention (ISO 7001 PI PF 011) — no trademark
       conflicts. Drawn slightly above centre and shifted left of optical centre
       so the visual mass balances inside the rounded square. -->
  <g fill="url(#ink)" stroke="url(#ink)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="512" cy="240" r="78"/>

    <!-- Arms — horizontal bar with rounded ends -->
    <rect x="184" y="358" width="656" height="84" rx="42" ry="42"/>

    <!-- Body trunk — short, from below the shoulders to the hips -->
    <rect x="468" y="442" width="88" height="200" rx="44" ry="44"/>

    <!-- Legs — diagonal strokes diverging from hip into a V.
         stroke-width matches the trunk so the joint reads cleanly. -->
    <line x1="512" y1="630" x2="372" y2="852" stroke-width="84"/>
    <line x1="512" y1="630" x2="652" y2="852" stroke-width="84"/>
  </g>
</svg>
