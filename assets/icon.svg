<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Includa">
  <title>Includa</title>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="highlight" cx="28%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02151b"/>
      <stop offset="100%" stop-color="#08131d"/>
    </linearGradient>
  </defs>

  <!-- Rounded background — iOS-style 22% corner radius -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg-grad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#highlight)"/>

  <!-- Universal accessibility figure: person with arms outstretched.
       Head + horizontal arms (with rounded ends) + body trunk extending
       below. Public-domain symbol convention used by iOS/macOS Accessibility
       settings and ISO 7001 PI PF 011. -->
  <g fill="url(#ink)">
    <!-- Head -->
    <circle cx="512" cy="288" r="78"/>

    <!-- Arms — horizontal bar at shoulder height, rounded ends -->
    <rect x="208" y="402" width="608" height="84" rx="42" ry="42"/>

    <!-- Trunk — vertical bar from below the shoulders down -->
    <rect x="464" y="486" width="96" height="280" rx="48" ry="48"/>
  </g>
</svg>
